name: Prepare backend implementation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-backend.yml']
permissions:
  contents: read
jobs:
  remove-created-branch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ref = 'heads/codex/backend-stages-0-3';
            let branch;
            try {
              branch = await github.rest.git.getRef({ ...context.repo, ref });
            } catch (error) {
              if (error.status === 404) { core.info('Branch is already absent'); return; }
              throw error;
            }
            if (branch.data.object.sha !== '1251dc23df46a0bec3b6f31ae9ba7fbb189edc3d') {
              throw new Error('Branch has changed; refusing to delete unrelated work');
            }
            await github.rest.git.deleteRef({ ...context.repo, ref });
            core.info('Deleted codex/backend-stages-0-3 as requested');
  dependency-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare package manifests
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          fs.mkdirSync('/tmp/obs-stage0', { recursive: true });
          fs.mkdirSync('/tmp/obs-stage3', { recursive: true });
          fs.writeFileSync('/tmp/obs-stage0/package.json', JSON.stringify({"name":"obs-e-com","version":"0.1.0","private":true,"type":"module","description":"A typed, tested and observable backend learning project","engines":{"node":">=24 <25"},"scripts":{"dev":"node --env-file-if-exists=.env --import tsx --watch src/index.ts","start":"node --env-file-if-exists=.env dist/index.js","typecheck":"tsc --noEmit","test":"tsx --test tests/*.test.ts","build":"tsc -p tsconfig.build.json","check":"npm run typecheck && npm test && npm run build"},"devDependencies":{"@types/node":"^24.0.0","tsx":"^4.20.6","typescript":"~5.9.3"}}));
          fs.writeFileSync('/tmp/obs-stage3/package.json', JSON.stringify({"name":"obs-e-com","version":"0.1.0","private":true,"type":"module","description":"A typed, tested and observable backend learning project","engines":{"node":">=24 <25"},"scripts":{"dev":"node --env-file-if-exists=.env --import tsx --watch src/index.ts","start":"node --env-file-if-exists=.env dist/index.js","typecheck":"tsc --noEmit","test":"tsx --test tests/*.test.ts","build":"tsc -p tsconfig.build.json","check":"npm run typecheck && npm test && npm run build"},"devDependencies":{"@types/node":"^24.0.0","tsx":"^4.20.6","typescript":"~5.9.3","@types/express":"^5.0.3"},"dependencies":{"express":"^5.1.0"}}));
          NODE
      - run: npm install --package-lock-only --ignore-scripts --prefix /tmp/obs-stage0
      - name: Emit foundation lock
        run: node -e 'console.log("STAGE0_LOCK=" + JSON.stringify(require("/tmp/obs-stage0/package-lock.json")))'
      - run: npm install --package-lock-only --ignore-scripts --prefix /tmp/obs-stage3
      - name: Emit Express lock
        run: node -e 'console.log("STAGE3_LOCK=" + JSON.stringify(require("/tmp/obs-stage3/package-lock.json")))'
